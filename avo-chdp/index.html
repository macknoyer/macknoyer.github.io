<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f2f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AVO ЧДП">
<meta name="robots" content="noindex">
<title>AVO — ЧДП · мобильный прототип</title>
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/app-icon.svg">
<style>
:root{
  --font:"SF UI Display","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-ios:"SF Pro Text",-apple-system,BlinkMacSystemFont,var(--font);
  --surface:#f1f2f5; --white:#ffffff;
  --bg-950:#19191f; --bg-800:#39393f; --bg-400:#99999e; --bg-200:#e1e1e5; --bg-100:#f1f2f5;
  --primary-950:#0b1d47; --primary-600:#2055cf; --primary-100:#dce5f9;
  --pos-500:#2aa754; --pos-50:#e2f8ea; --success-icon:#0dbf54;
  --alert:#ec0456;
  --text:#19191f; --text-600:#5d5d63; --text-400:#99999e; --text-300:#bdbdc2;
  --icon-950:#19191f; --icon-400:#99999e;
  --border-200:#e1e1e5; --border-100:#f1f2f5;
  --overlay:rgba(41,41,47,.55);
  --ease-ios:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.22,.8,.24,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:#e4e5ea;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
p,h1,h2,ul{margin:0}
:focus-visible{outline:2px solid var(--primary-600);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg{display:block;flex:none}
img{display:block;flex:none}

/* stage */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px}
.phone{position:relative;width:390px;height:844px;border-radius:0;overflow:hidden;background:var(--surface);box-shadow:0 24px 64px rgba(25,25,31,.16);flex:none;isolation:isolate}
#app,#fx{position:absolute;inset:0}
#fx{pointer-events:none}
.panel{width:300px;flex:none;display:flex;flex-direction:column;gap:20px;font-size:14px;line-height:20px;color:var(--text)}
.panel .eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-600)}
.panel h1{font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.408px}
.panel fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.panel legend{padding:0;margin-bottom:8px;font-weight:600}
.scn{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--white);cursor:pointer}
.scn input{margin:2px 0 0;accent-color:var(--primary-600)}
.scn b{display:block;font-weight:500}
.scn span span{display:block;color:var(--text-600);font-size:13px;line-height:18px}
.panel ul{padding-left:18px;color:var(--text-600);display:flex;flex-direction:column;gap:6px}
.panel{display:none}
.stage{gap:0;background:#e4e5ea}
html,body{overscroll-behavior:none}
body{touch-action:manipulation}

/* screens */
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;background:var(--surface)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:stretch}
.scroll>*{flex:none}
.appbar{flex:none;position:relative}
.sb{height:54px;color:var(--text)}
.sb.light{color:#fff}
.ab-row{position:relative;height:40px}
.ab-back{position:absolute;left:6px;top:-2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;border-radius:12px;color:var(--icon-950)}
.ab-title{position:absolute;left:50%;top:0;width:204px;margin-left:-102px;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:20px;font-weight:600}
.home{height:34px;position:relative;flex:none}
.home i{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:100px;background:var(--bg-950)}
.bottom{flex:none;background:var(--bg-100);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.bottom-in{padding:0 16px;display:flex;flex-direction:column;gap:16px}
.legal{font-size:12px;line-height:16px;color:var(--text-600);text-align:center}
.legal a{color:var(--primary-600);text-decoration:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;margin:0;text-align:center;text-decoration:none;transition:background-color .12s ease,color .12s ease}
.btn-l{min-height:56px;padding:16px 24px;border-radius:16px;font-size:16px;line-height:24px;font-weight:500}
.btn-m{min-height:44px;padding:12px 16px;border-radius:12px;font-size:14px;line-height:20px;font-weight:500}
.btn-primary{background:var(--bg-950);color:#fff}
.btn-primary:active{background:var(--bg-800)}
.btn-primary:disabled{background:var(--bg-200);color:var(--text-600);cursor:default}
.btn-tertiary{background:var(--bg-100);color:var(--text)}
.btn-tertiary:active{background:var(--bg-200)}

/* cards & rows */
.card{background:var(--white);border-radius:16px;width:100%}
.lbl{display:block;font-size:16px;line-height:22px;color:var(--text-600)}
.kv{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.kv-t{flex:1;min-width:0;display:flex;gap:4px;align-items:flex-start;padding-top:1px}
.kv-l{font-size:14px;line-height:17px;color:var(--text-600)}
.kv-i{display:flex;align-self:stretch;align-items:center;color:var(--icon-400)}
.kv-v{min-width:130px;text-align:right;font-size:14px;line-height:18px;font-weight:500;white-space:nowrap}
.loan-head{padding:12px 16px;display:flex;align-items:center;gap:16px;font-size:14px;line-height:18px;font-weight:500;white-space:nowrap}
.loan-rows{padding:16px;border-top:1px solid var(--border-200)}
.src{width:100%;display:flex;align-items:center;gap:16px;padding:12px 16px;border:0;border-radius:16px;background:var(--white);text-align:left;color:var(--text)}
.src.alt{background:var(--bg-100)}
.src-m{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.src-b{display:flex;gap:4px;align-items:flex-end;white-space:nowrap}
.src-b b{font-size:16px;line-height:20px;font-weight:500}
.src-b small{font-size:10.5px;line-height:16px;font-weight:600;text-transform:uppercase}
.src-i{display:flex;gap:4px;align-items:center;height:24px;white-space:nowrap;font-size:12px;line-height:16px}
.src-i em{font-style:normal;color:var(--text-600)}
.src .chev{color:var(--icon-400)}
.src .tick{color:var(--primary-600)}

/* field */
.field{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:13px 16px;border-radius:8px;background:var(--white);overflow:hidden;cursor:text}
.field:focus-within{background:var(--bg-200)}
.field input{flex:1;min-width:0;height:22px;margin:0;padding:0;border:0;outline:0;background:transparent;font-size:16px;line-height:22px;color:var(--text);-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--text-600);opacity:1}
.field-sfx{margin-right:2px;font-size:16px;line-height:22px;color:var(--text-600)}
.field.is-error input{color:var(--alert)}
.field.is-error::after{content:"";position:absolute;left:0;right:0;bottom:.5px;height:1.5px;background:var(--alert);opacity:.5}
.fdesc{font-size:14px;line-height:17px}
.fdesc.info{color:var(--text-400)}
.fdesc.err{color:var(--alert)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:8px 16px;border:0;border-radius:99px;background:var(--white);font-size:14px;line-height:18px;color:var(--text);white-space:nowrap}
.chip.on{background:var(--primary-950);color:#fff;font-weight:500}

/* status colored */
.sc{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;width:100%}
.sc-positive{background:var(--pos-50)}
.sc-positive>svg{color:var(--success-icon)}
.sc-info{background:var(--primary-100)}
.sc-info>svg{color:var(--primary-600)}
.sc-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sc-t{font-size:14px;line-height:18px;font-weight:500}
.sc-d{padding-bottom:2px;font-size:14px;line-height:18px;color:var(--text-600)}

/* disclosure */
.disc{background:var(--white);border-radius:8px;width:100%}
.disc-b{width:100%;display:flex;align-items:center;gap:3px;padding:16px;border:0;background:none;text-align:left;color:var(--text)}
.disc-b span{flex:1;padding-bottom:2px;font-size:16px;line-height:20px;font-weight:600}
.disc-b svg{color:var(--icon-400)}
.disc-body{padding:0 16px 16px;margin-top:-8px}

/* control with label (radio card) */
.ctl{display:block;width:100%;padding:16px;border-radius:16px;background:var(--white);cursor:pointer}
.ctl:has(input:focus-visible){outline:2px solid var(--primary-600);outline-offset:2px}
.ctl-top{display:flex;gap:8px;align-items:flex-start}
.ctl-top>span:first-child{flex:1;min-width:0;font-size:14px;line-height:18px;font-weight:500}
.ctl{position:relative}
.ctl-top svg{color:var(--icon-400)}
.ctl-top svg.on{color:var(--primary-600)}
.ctl-mid{display:flex;gap:10px;align-items:center;margin-top:8px}
.sum18{flex:1;min-width:0;display:flex;gap:2px;align-items:flex-end;white-space:nowrap}
.sum18 b{font-size:18px;line-height:22px;font-weight:600}
.sum18 i{font-style:normal;padding-bottom:1px;font-size:14px;line-height:18px;font-weight:600}
.tag{height:26px;padding:4px 8px;border-radius:500px;background:var(--bg-100);font-size:14px;line-height:18px;font-weight:600;white-space:nowrap}
.ctl-cap{margin-top:8px;font-size:14px;line-height:17px;color:var(--text-600)}

/* list */
.list{display:flex;flex-direction:column;gap:8px;padding:16px}
.li{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:0;border:0;background:none;text-align:left;color:var(--text)}
.li-ic{display:flex;width:24px;height:36px;padding:8px 2px;color:var(--icon-400);flex:none}
.li-t{flex:1;min-width:0;padding:1px 0;font-size:14px;line-height:18px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li>svg{color:var(--icon-400)}

/* loan widget */
.w-top{padding:16px;display:flex;flex-direction:column;gap:16px}
.w-name{height:18px;display:flex;align-items:center;justify-content:space-between}
.w-name span{font-size:14px;line-height:18px;font-weight:500;white-space:nowrap}
.w-edit{position:relative;width:42px;height:42px;border:0;border-radius:20px;background:none;padding:0;color:var(--icon-400);flex:none}
.w-edit svg{position:absolute;right:9px;top:9px}
.cap12{font-size:12px;line-height:16px;color:var(--text-600)}
.sum32{display:flex;gap:4px;align-items:flex-end;white-space:nowrap}
.sum32 b{font-size:32px;line-height:36px;font-weight:600}
.sum32 i{font-style:normal;height:32px;display:flex;align-items:center;font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.408px}
.w-rows{padding:0 16px 16px}
.w-btn{padding:4px 16px 20px;border-bottom:1px solid var(--border-200)}
.acts{display:flex;justify-content:center;gap:8px;padding:16px}
.act{width:75.5px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;border:0;background:none;font-size:12px;line-height:16px;color:var(--text)}

/* figma-specific blocks */
.headline{font-size:18px;line-height:22px;font-weight:600;text-align:center}
.dw-head{padding:16px;display:flex;flex-direction:column;gap:16px}
.w-status{padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border-200)}
.tag-s{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;padding:2px 8px 2px 4px;border-radius:500px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.tag-s.success{background:var(--pos-500);color:#fff}
.tag-m{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:500px;font-size:14px;line-height:18px;font-weight:600;white-space:nowrap;flex:none}
.tag-m.neutral{background:var(--bg-100);color:var(--text)}
.tag-m.success{background:var(--pos-500);color:#fff}
.sc>svg.arr{color:var(--icon-400)}
.sc-attach{border-radius:8px 8px 0 0;padding:8px 8px 25px;margin-bottom:-17px}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:6px 0;border-radius:8px;font-size:14px;line-height:20px;font-weight:500;color:var(--primary-600)}
.bal-m{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.bal-n{height:24px;display:flex;align-items:center;font-size:12px;line-height:16px;font-weight:400}
.req{background:var(--white);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.req h3{margin:0;padding-bottom:2px;font-size:16px;line-height:20px;font-weight:600}
.fieldbtn{width:100%;border:0;text-align:left;font:inherit;cursor:pointer}
.fieldbtn:focus-within{background:var(--white)}
.fieldbtn:active{background:var(--bg-200)}
.field .ph,.field .val{flex:1;min-width:0;font-size:16px;line-height:22px;white-space:nowrap}
.field .ph{color:var(--text-600)}
.field .val{color:var(--text);transition:color .2s ease}
.field.is-error .val{color:var(--alert)}
.field-sfx.light{color:var(--text-400)}
.req,.field .val{animation:appear .3s var(--ease-out) backwards}

/* «Порядок погашения» — titleAction с шевроном (435408 свёрнут / 435331 раскрыт) */
.sc.top{align-items:flex-start}
.acc{gap:0}
.acc-h{width:100%;height:32px;display:flex;align-items:center;gap:3px;padding:0;border:0;background:none;text-align:left;color:var(--text);transition:opacity .18s ease}
.acc-h:active{opacity:.72}
.acc-t{flex:1;min-width:0;padding-bottom:2px;font-size:16px;line-height:20px;font-weight:600}
.acc-i{min-width:50px;padding:6px 0;display:flex;justify-content:flex-end;color:var(--icon-400)}
.acc-i svg{transition:transform .34s var(--ease-ios)}
.acc.open .acc-i svg{transform:rotate(180deg)}
.acc-b{padding-top:8px;animation:expand .32s var(--ease-out) backwards}

/* cardsModal · Figma 12975:48437 */
.ovl.lite{background:rgba(41,41,47,.15)}
.cm{display:flex;flex-direction:column;gap:16px}
.cm-in{padding:24px 16px 0;display:flex;flex-direction:column;gap:12px}
.cm-title{height:32px;display:flex;align-items:flex-end;padding-bottom:2px;font-size:16px;line-height:20px;font-weight:600;color:var(--text)}
.cm-list{display:flex;flex-direction:column;gap:8px}
.cm .src{background:var(--bg-100);cursor:pointer}
.src-b .lk{align-self:center}
.src.locked{cursor:default}
.src.locked .src-b{color:var(--text-600)}
.src.locked:active{transform:none}
.src.locked.nudge{animation:nudge .36s var(--ease-out)}
.cm-add{width:100%;display:flex;padding:14px 16px;border:0;border-radius:16px;background:var(--bg-100);color:var(--primary-600);text-align:left}
.cm-add span{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:14px;line-height:20px;font-weight:500}
.cm-home{padding:0 16px}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.src{animation:none}

/* sheets */
.ovl{position:absolute;inset:0;z-index:4;border:0;padding:0;background:var(--overlay);animation:fadeIn .3s ease backwards}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:calc(100% - 40px);overflow-y:auto;display:flex;flex-direction:column;padding-top:8px;border-radius:16px 16px 0 0;background:var(--white);box-shadow:0 -8px 32px rgba(25,25,31,.08);animation:sheetIn .46s var(--ease-ios) backwards}
.grab{width:36px;height:5px;margin:0 auto;border-radius:2.5px;background:var(--bg-400);flex:none}
.sheet h2.s-title{padding:16px 16px 8px;font-size:18px;line-height:22px;font-weight:600}
.cf{padding:24px 16px 0;display:flex;flex-direction:column;align-items:center;gap:24px}
.cf>svg{color:var(--primary-600)}
.cf-body{width:100%;padding:0 8px}
.cf-head{display:flex;flex-direction:column;gap:16px;align-items:center;padding-bottom:16px}
.cf-head h2{width:100%;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.22px;text-align:center}
.sum-xl{display:flex;gap:6px;align-items:flex-end;white-space:nowrap}
.sum-xl b{font-size:32px;line-height:36px;font-weight:600}
.sum-xl i{font-style:normal;padding-top:6px;font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.408px}
.bul{list-style:none;padding:0 0 24px;display:flex;flex-direction:column;gap:16px}
.bul li{display:flex;gap:12px;align-items:flex-start;color:var(--text-600);font-size:16px;line-height:22px}
.bul li svg{color:var(--icon-400)}
.bul li.strong{font-weight:600;line-height:20px}
.sheet-btns{padding:16px 16px 0;display:flex;flex-direction:column;gap:16px}

/* status */
.st-top{flex:none;background:var(--bg-950);display:flex;flex-direction:column;gap:1px}
.st-top .sb{margin-bottom:4px}
.st-logo{padding:12px 0;display:flex;justify-content:center}
.st-status{position:relative;width:100%;aspect-ratio:390/74;margin-bottom:-1px}
.st-wave{position:absolute;left:0;bottom:0;width:100%;height:auto}
.st-icon{position:absolute;left:50%;top:0;width:16.41%;height:auto;transform-origin:50% 50%;translate:-50% 0}
.st-body{flex:1;min-height:0;background:var(--white);display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto}
.st-main{padding:8px 24px 0;display:flex;flex-direction:column;gap:24px;align-items:center}
.st-title{width:100%;font-size:18px;line-height:22px;font-weight:600;text-align:center}
.st-sum{width:100%;display:flex;flex-direction:column;align-items:center}
.st-sub{font-size:16px;line-height:22px;color:var(--text-600);text-align:center}
.st-info{width:100%;display:flex;flex-direction:column;gap:4px}
.pay{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--border-100);border-radius:16px}
.pay-m{flex:1;min-width:0}
.pay-t{font-size:18px;line-height:22px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay-s{font-size:14px;line-height:18px;color:var(--text-600)}
.st-row{width:100%;padding:8px 0;display:flex;gap:8px;align-items:flex-start}
.st-row>span{flex:1;padding-top:2px;font-size:14px;line-height:17px;color:var(--text-600);white-space:nowrap}
.st-row div{padding-top:1px;display:flex;gap:8px;align-items:center;white-space:nowrap;font-size:14px;line-height:18px;font-weight:500}
.st-btns{padding:16px 16px 0;display:flex;flex-direction:column;gap:16px}
.st-foot{display:flex;flex-direction:column;gap:8px}

/* push */
.push{position:absolute;left:6px;right:6px;top:10px;z-index:8;display:flex;gap:10px;align-items:flex-start;padding:14px;border:0;border-radius:24px;text-align:left;isolation:isolate;animation:pushIn .6s var(--spring) backwards}
.push::before,.push::after{content:"";position:absolute;inset:0;border-radius:24px;z-index:-1}
.push::before{background:rgba(166,166,166,.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.push::after{background:#333;mix-blend-mode:color-dodge}
.push img{border-radius:8.5px}
.push-c{flex:1;min-width:0;display:flex;gap:5px;align-items:flex-start;font-family:var(--font-ios);font-size:15px;line-height:20px;letter-spacing:-.23px;color:var(--text)}
.push-c div{flex:1;min-width:0;display:flex;flex-direction:column}
.push-c b{height:21px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.push-c small{flex:none;width:52px;text-align:right;font-size:13px;color:var(--text-600)}

/* ---------- motion ---------- */
/* press feedback */
.btn,.src,.ctl,.li,.chip,.act,.w-edit,.ab-back,.disc-b,.push,.scn,.cm-add{transition:transform .18s var(--ease-out),background-color .22s ease,color .22s ease,opacity .18s ease,box-shadow .22s ease}
.btn:active:not(:disabled){transform:scale(.97)}
.src:active,.ctl:active,.act:active,.push:active,.cm-add:active{transform:scale(.98)}
.li:active,.disc-b:active{transform:scale(.985);opacity:.72}
.chip:active{transform:scale(.94)}
.ab-back:active,.w-edit:active{background:rgba(25,25,31,.07)}
.scn:active{transform:scale(.98)}
.field{transition:background-color .22s ease}
.field input{transition:color .2s ease}
/* state changes inside a screen */
.chip.on{animation:chipOn .34s var(--spring)}
.ctl-top svg{transition:color .2s ease}
.ctl-top svg.on{animation:pop .42s var(--spring)}
.disc-b svg{transition:transform .34s var(--ease-ios)}
.disc.open .disc-b svg{transform:rotate(180deg)}
.disc-body{animation:expand .32s var(--ease-out) backwards}
.fdesc,.sc{animation:appear .3s var(--ease-out) backwards}
.field.is-error::after{animation:fadeIn .25s ease backwards}
.tick{animation:pop .4s var(--spring) backwards}
/* screens */
.scr-in-push{animation:inPush .46s var(--ease-ios) backwards;box-shadow:-12px 0 32px rgba(25,25,31,.10)}
.scr-out-push{animation:outPush .46s var(--ease-ios) forwards}
.scr-in-pop{animation:inPop .46s var(--ease-ios) backwards}
.scr-out-pop{animation:outPop .46s var(--ease-ios) forwards;box-shadow:-12px 0 32px rgba(25,25,31,.10)}
.scr-in-present{animation:inPresent .52s var(--ease-ios) backwards}
.scr-out-fade{animation:outFade .42s ease forwards}
.scr-in-fade{animation:inFade .5s var(--ease-ios) backwards}
.scr-out-dismiss{animation:outDismiss .4s var(--ease-ios) forwards}
.scr-in-present .st-icon{animation:pop .7s .2s var(--spring) backwards}
.scr-in-present .st-main>*,.scr-in-present .st-btns>*{animation:rise .5s var(--ease-out) backwards}
.scr-in-present .st-main>:nth-child(1){animation-delay:.26s}
.scr-in-present .st-main>:nth-child(2){animation-delay:.32s}
.scr-in-present .st-main>:nth-child(3){animation-delay:.38s}
.scr-in-present .st-main>:nth-child(4){animation-delay:.44s}
.scr-in-present .st-btns>:nth-child(1){animation-delay:.48s}
.scr-in-present .st-btns>:nth-child(2){animation-delay:.54s}
.scr-in-fade .scroll>*{animation:rise .45s var(--ease-out) backwards}
.scr-in-fade .scroll>:nth-child(2){animation-delay:.06s}
/* sheets and push */
.sheet .cf>svg{animation:pop .6s .14s var(--spring) backwards}
.sheet .cf-head,.sheet .bul li,.sheet .sheet-btns,.cm-title,.cm-list>*{animation:rise .42s var(--ease-out) backwards}
.sheet .cf-head{animation-delay:.12s}
.sheet .bul li:nth-child(1){animation-delay:.18s}
.sheet .bul li:nth-child(2){animation-delay:.22s}
.sheet .bul li:nth-child(3){animation-delay:.26s}
.sheet .sheet-btns{animation-delay:.3s}
.cm-title{animation-delay:.08s}
.cm-list>:nth-child(1){animation-delay:.11s}.cm-list>:nth-child(2){animation-delay:.14s}.cm-list>:nth-child(3){animation-delay:.17s}
.cm-list>:nth-child(4){animation-delay:.2s}.cm-list>:nth-child(5){animation-delay:.23s}.cm-list>:nth-child(6){animation-delay:.26s}.cm-list>:nth-child(7){animation-delay:.29s}
.ovl.leave{animation:fadeOut .28s ease forwards}
.sheet.leave{animation:sheetOut .32s var(--ease-ios) forwards}
.push.leave{animation:pushOut .34s var(--ease-ios) forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes pushIn{from{opacity:0;transform:translateY(-130%) scale(.94)}}
@keyframes pushOut{to{opacity:0;transform:translateY(-130%) scale(.96)}}
@keyframes inPush{from{transform:translateX(100%)}}
@keyframes outPush{to{transform:translateX(-28%);filter:brightness(.92)}}
@keyframes inPop{from{transform:translateX(-28%);filter:brightness(.92)}}
@keyframes outPop{to{transform:translateX(100%)}}
@keyframes inPresent{from{opacity:0;transform:translateY(48px) scale(.98)}}
@keyframes outFade{to{opacity:0;transform:scale(.95)}}
@keyframes inFade{from{opacity:0;transform:scale(.97)}}
@keyframes outDismiss{to{opacity:0;transform:translateY(56px)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes appear{from{opacity:0;transform:translateY(-6px)}}
@keyframes expand{from{opacity:0;transform:translateY(-8px)}}
@keyframes chipOn{0%{transform:scale(.9)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* real phone: the device draws its own status bar and home indicator */
@media (max-width:500px){
  body{background:var(--surface)}
  .stage{display:block;padding:0}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .sb,.home{display:none}
  .appbar,.st-top{padding-top:max(10px,env(safe-area-inset-top))}
  .bottom,.st-foot,.sheet{padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .scroll.solo{padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .push{top:calc(env(safe-area-inset-top) + 8px)}
}
</style>

/* ---------- state ---------- */
var params = new URLSearchParams(location.search);
var fromHash = location.hash.replace('#', '');

var S, timers = [];

function fmt(n) { return String(Math.max(0, Math.round(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function balOf(c) { return c.id === 'kap' && scen === 'error' ? 10000000 : c.bal; }
function startAmount() { return scen === 'full' ? String(debt()) : ''; }
function fresh() { return { screen: 'info', from: 'info', pick: 'next', card: 'kap', amount: startAmount(), open: false, settled: scen === 'full', paid: 0, full: false, sheet: null, push: null }; }
function card() { return CARDS.filter(function (c) { return c.id === S.card; })[0] || CARDS[0]; }
/* что показывает экран ЧДП: 435332 пусто, 435408/435331 сумма, 435333 ошибка */
function chdp() {
  var amount = parseInt(S.amount, 10) || 0;
  var dd = scen === 'in-dd', acc = accrued(), total = PRINCIPAL + acc;
  var charge = Math.max(0, amount - LOAN.deposit);                      // с карты — только недостающая сумма
  var inRange = amount >= PAY && amount <= total;
  var funds = inRange && charge > balOf(card());
  var range = amount > total || (amount > 0 && amount < PAY && S.settled);
  var msg = amount > total ? rangeMsg() : funds ? 'Недостаточно средств' : range ? rangeMsg() : '';
  var rows = dd
    ? [['Платеж по графику', fmt(Math.min(amount, PAY)) + ' UZS'], ['Досрочное погашение', fmt(amount - PAY) + ' UZS']]
    : [['Начисленные проценты', fmt(Math.min(amount, acc)) + ' UZS'], ['Досрочное погашение', fmt(amount - acc) + ' UZS']];
  var od = dd ? PRINCIPAL - (PAY - acc) - Math.max(0, amount - PAY) : PRINCIPAL - Math.max(0, amount - acc);
  var newPay = ann(od, dd ? LOAN.term - 1 : LOAN.term);
  var ok = inRange && !funds;
  return { amount: amount, err: !!msg, msg: msg, ok: ok, rows: rows, full: amount >= total, newPay: newPay, banner: ok && S.settled };
}
function set(patch) { for (var k in patch) S[k] = patch[k]; render(); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function reset() { clearTimers(); S = fresh(); render(); }
function canPay() { return chdp().ok; }

function finish() {
  clearTimers();
  var st = chdp();
  set({ screen: 'status', sheet: null, push: null, paid: st.amount, full: st.full });
  if (!st.full) timers.push(setTimeout(function () { set({ push: 'done' }); }, 1400));
}

/* ---------- actions ---------- */
var ACT = {
  noop: function () {},
  goInfo: function () { set({ screen: 'info', sheet: null }); },
  goRepay: function () { set({ screen: 'repay', sheet: null }); },
  goChdp: function (from) { set({ screen: 'chdp', from: from || 'info', amount: startAmount(), open: false, settled: scen === 'full', sheet: null }); },
  toggleAcc: function () { set({ open: !S.open }); },
  openCards: function () { var a = document.activeElement; if (a && a.blur) a.blur(); set({ sheet: 'cards' }); },
  pickCard: function (id) { set({ card: id, sheet: null }); },
  locked: function (id, el) { el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge'); },
  back: function () { set({ screen: S.from, sheet: null }); },
  pick: function (which) { set({ pick: which }); },
  submit: function () { if (canPay()) set({ sheet: 'modal' }); },
  closeSheet: function () { set({ sheet: null }); },
  confirm: finish,
  done: reset,
  hidePush: function () { clearTimers(); set({ push: null }); },
  reset: reset,
  scen: function (id) {
    if (!SCEN[id]) return;
    scen = id;
    try { history.replaceState(null, '', '#' + id); } catch (err) {}

};

function vPanel() {
  return '<p class="eyebrow">AVO · прототип · 1 в 1 с Figma · 16.11</p><h1>Частичное досрочное погашение микрозайма</h1>'

        return '<label class="scn"><input type="radio" name="scn" value="' + id + '" data-change="scen"' + (id === scen ? ' checked' : '') + '>'
          + '<span><b>' + SCEN[id].t + '</b><span>' + SCEN[id].d + '</span></span></label>';
      }).join('') + '</fieldset>'
    + btn('Начать заново', 'reset', { size: 'm', tertiary: true })
    + '<ul><li>Путь: карточка займа → «Погасить частично» (или «Внести платеж» → «Погасить частично») → сумма → «Погасить досрочно» → попап → статус → пуш</li>'
    + '<li>«Порядок погашения» свёрнут (435408), раскрывается по тапу (435331)</li>'
    + '<li>Тап по «Способ оплаты» открывает попап с картами (как в Figma). Карты AVO platinum заблокированы. С AVO UZCARD digital или Anorbank любая допустимая сумма даёт «Недостаточно средств»</li>'
    + '<li>Займ: 40 000 000 + 10 % «Защита от штрафов» = 44 000 000, 34,9 % годовых, 3 мес. Платёж 15 527 929, уже внесено 1 250 000</li>'
    + '<li>Сумма ЧДП — от одного платежа до общей задолженности; баннер с новым платежом — после ввода и проверки баланса</li>'
    + '<li>Тексты — из макетов раздела «ЧДП» (Figma, 16.11), без изменений</li>'
    + '<li>Сценарий можно открыть по ссылке: #chdp, #error, #before-dd, #in-dd, #full</li></ul>';

/* ---------- render: a small DOM morph keeps elements alive, so CSS transitions and focus survive ---------- */
var app = document.getElementById('app'), fx = document.getElementById('fx'), panel = document.getElementById('panel');
var ORDER = { info: 0, repay: 1, chdp: 2, status: 3 };
function nbsp(root) {
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
  while ((n = w.nextNode())) {
    var t = n.nodeValue.replace(/(\d) (?=\d)/g, '$1\u00a0').replace(/(\d) UZS/g, '$1\u00a0UZS').replace(/•••• (\d)/g, '••••\u00a0$1');
    if (t !== n.nodeValue) n.nodeValue = t;
  }
}
var shown = null;
var SCREEN_IN = /\s*scr-in-[\w-]+/g;

function syncAttrs(a, b) {
  var i, at;
  for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i]; if (!b.hasAttribute(at.name)) a.removeAttribute(at.name); }
  for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
}
function same(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) return false;
  return a.nodeType !== 1 || a.getAttribute('data-key') === b.getAttribute('data-key');
}
function morph(from, to) {
  var a = Array.prototype.slice.call(from.childNodes), b = Array.prototype.slice.call(to.childNodes), i;
  for (i = 0; i < b.length; i++) {
    var na = a[i], nb = b[i];
    if (!na) { from.appendChild(nb); continue; }
    if (!same(na, nb)) { from.replaceChild(nb, na); continue; }
    if (na.nodeType !== 1) { if (na.nodeValue !== nb.nodeValue) na.nodeValue = nb.nodeValue; continue; }
    var keepIn = (na.className && typeof na.className === 'string') ? (na.className.match(SCREEN_IN) || []).join('') : '';
    syncAttrs(na, nb);
    if (keepIn && !na.classList.contains('leave')) na.className += keepIn;
    if (na.tagName === 'INPUT') {
      var val = nb.getAttribute('value') || '';
      if (na.type !== 'radio' && na.value !== val) {
        na.value = val;
        if (document.activeElement === na) { try { na.setSelectionRange(val.length, val.length); } catch (err) {} }
      }
      na.checked = nb.hasAttribute('checked');
    }
    morph(na, nb);
  }
  for (i = a.length - 1; i >= b.length; i--) from.removeChild(a[i]);
}
function leave(el, cls, z) {
  if (typeof el.className === 'string') el.className = el.className.replace(SCREEN_IN, '');
  el.classList.add(cls);
  if (z != null) el.style.zIndex = z;
  fx.appendChild(el);
  var gone = false;
  function done(e) { if (gone || (e && e.target !== el)) return; gone = true; if (el.parentNode) el.parentNode.removeChild(el); }
  el.addEventListener('animationend', done);
  setTimeout(done, 800);
}
function render() {
  var tpl = document.createElement('div');
  tpl.innerHTML = view();
  nbsp(tpl);
  var keys = {};
  Array.prototype.forEach.call(tpl.children, function (c) { var k = c.getAttribute('data-key'); if (k) keys[k] = true; });
  // popups and the push that are going away slide out instead of vanishing
  Array.prototype.slice.call(app.children).forEach(function (c) {
    var k = c.getAttribute('data-key');
    if (k && k.indexOf('scr-') !== 0 && !keys[k]) leave(c, 'leave');
  });
  if (shown === null) {
    morph(app, tpl);
    var first = app.querySelector('.screen'); if (first) first.classList.add('scr-in-fade');
  } else if (shown !== S.screen) {
    var mode = S.screen === 'status' ? 'present' : shown === 'status' ? 'dismiss' : ORDER[S.screen] > ORDER[shown] ? 'push' : 'pop';
    var old = app.querySelector('.screen');
    if (old) leave(old, { push: 'scr-out-push', pop: 'scr-out-pop', present: 'scr-out-fade', dismiss: 'scr-out-dismiss' }[mode], mode === 'push' || mode === 'present' ? 0 : 2);
    morph(app, tpl);
    var nw = app.querySelector('.screen');
    if (nw) nw.classList.add({ push: 'scr-in-push', pop: 'scr-in-pop', present: 'scr-in-present', dismiss: 'scr-in-fade' }[mode]);
  } else {
    morph(app, tpl);
  }
  shown = S.screen;
}
function renderPanel() { panel.innerHTML = vPanel(); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-arg'), el);
});
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-change]');
  if (el && ACT[el.getAttribute('data-change')]) ACT[el.getAttribute('data-change')](el.value);
});
document.addEventListener('input', function (e) {
  if (e.target.id !== 'amount') return;
  set({ amount: e.target.value.replace(/\D/g, '').slice(0, 9), settled: false });
  // подсказку «от … до …» показываем, когда человек перестал печатать или ушёл из поля
  clearTimeout(settleT);
  settleT = setTimeout(settle, 900);
});
var settleT = null;
function settle() { clearTimeout(settleT); if (S.screen === 'chdp' && !S.settled) set({ settled: true }); }
document.addEventListener('focusout', function (e) { if (e.target.id === 'amount') setTimeout(settle, 0); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.sheet) set({ sheet: null });
  if (e.key === 'Enter' && e.target.id === 'amount') e.target.blur();
});

window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if (SCEN[h] && h !== scen) { scen = h; reset(); renderPanel(); } });
S = fresh();
render();
renderPanel();
})();
